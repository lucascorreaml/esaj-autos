name: Testes

# A suíte não toca o e-SAJ: as respostas do tribunal são simuladas.
# Roda sem credencial e sem rede.
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Instala o pacote e as dependências de teste
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python -m pip install pytest responses

      - name: Roda a suíte
        run: pytest tests/ -q
