[project]
name = "esaj-autos"
version = "1.0.0"
description = "Baixa a cópia integral dos autos de processos do e-SAJ (TJSP) a partir do número CNJ"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Lucas Corrêa" },
]
keywords = ["esaj", "tjsp", "processo", "autos", "pasta-digital", "juridico"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Legal Industry",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Portuguese (Brazilian)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]
dependencies = [
    "requests>=2.32,<3",
    "pydantic>=2.10,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "responses>=0.25",
    "python-dotenv>=1.0",
]

[project.scripts]
esaj-autos = "esaj_autos.cli:main"

[project.gui-scripts]
esaj-autos-gui = "esaj_autos.gui:main"

[project.urls]
Repository = "https://github.com/lucascorreaml/esaj-autos"
Issues = "https://github.com/lucascorreaml/esaj-autos/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["esaj_autos"]
